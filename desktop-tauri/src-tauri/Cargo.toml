[package]
name = "steam-family-fit-analyzer-desktop"
version = "0.1.0"
description = "Desktop migration for Steam Family Fit Analyzer"
authors = ["iMoonDay"]
edition = "2021"

[lib]
name = "steam_family_fit_analyzer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
